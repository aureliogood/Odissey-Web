# Cabeceras de seguridad de Odissey para Nginx.
#
# POR QUE ESTE ARCHIVO ESTA SEPARADO
# ---------------------------------
# En Nginx, un add_header dentro de un `location` ANULA todos los
# add_header que venian del bloque `server`. No se suman: se
# reemplazan. Eso significa que si pones las cabeceras de seguridad
# en el bloque server y luego, dentro de un location, pones un solo
# `add_header Cache-Control`, ese location se queda SIN CSP, SIN
# HSTS y SIN X-Frame-Options.
#
# La solucion es tener las cabeceras en este archivo aparte y
# incluirlo en el server Y en cada location que necesite poner un
# add_header propio.
#
# Instalacion:
#   sudo cp odissey-security-headers.conf /etc/nginx/snippets/

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc-heads.net https://cdn.discordapp.com https://flagcdn.com https://placehold.co; connect-src 'self' https://odisseymc.site https://api.mcstatus.io https://open.er-api.com; frame-src 'self' https://discord.com; child-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content" always;