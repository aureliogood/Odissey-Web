<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baneos | Odissey</title>
  <meta name="description" content="Consulta los baneos activos de Odissey y envía una apelación.">
  <link rel="canonical" href="https://odisseymc.site/baneos">
  <meta name="description" content="Consulta los baneos activos de Odissey y envía una apelación.">
  <link rel="canonical" href="https://odisseymc.site/baneos">
  <link rel="stylesheet" href="theme.css?v=150">
  <link rel="stylesheet" href="css/dala-polish.css?v=158">
  <link rel="stylesheet" href="css/auth.css?v=150">
  <link rel="stylesheet" href="css/turnstile.css?v=150">
  <link rel="icon" href="img/favicon-48.png">
  <style>
    body{background:#080b12;color:#edf2fb;font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh}
    .ban-page{max-width:1050px;margin:0 auto;padding:70px 22px 100px}.ban-head h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 12px}.ban-head p{color:#aeb9ca;margin:0 0 28px}
    .ban-controls{display:flex;gap:12px;margin-bottom:18px}.ban-controls input,.appeal-form input,.appeal-form textarea,.appeal-form select,.admin-appeal textarea,.admin-appeal select{width:100%;padding:13px 15px;border:1px solid #303a4c;border-radius:12px;background:#111722;color:#fff;font:inherit}
    .ban-status{color:#aeb9ca;padding:20px 4px}.ban-list{display:grid;gap:14px}.ban-card{background:linear-gradient(135deg,#131a27,#0f141e);border:1px solid #273247;border-radius:16px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:8px 20px}.ban-name{font-size:1.2rem;font-weight:700}.ban-duration{color:#ffbd65;font-weight:600}.ban-reason{grid-column:1/-1;color:#e0e6ef;overflow-wrap:anywhere}.ban-meta{grid-column:1/-1;color:#9aa8bc;font-size:.9rem;display:flex;gap:8px 18px;flex-wrap:wrap}.ban-actions{grid-column:1/-1;display:flex;gap:10px;margin-top:8px}.ban-btn,.modal-btn{border:1px solid #394963;border-radius:10px;padding:10px 16px;background:#182337;color:#edf2fb;font:inherit;font-weight:650;cursor:pointer}.ban-btn:hover,.modal-btn:hover{background:#243552}.ban-btn.primary,.modal-btn.primary{background:#e9ad49;border-color:#e9ad49;color:#17120a}.ban-btn:disabled{opacity:.6;cursor:not-allowed}.ban-empty{border:1px dashed #354258;border-radius:14px;padding:28px;color:#aeb9ca}
    .ban-modal{position:fixed;inset:0;z-index:1000;background:#05070bd9;display:grid;place-items:center;padding:16px}.ban-modal[hidden]{display:none}.ban-dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:#101722;border:1px solid #303a4c;border-radius:18px;padding:24px;box-shadow:0 24px 80px #000a}.ban-dialog h2{margin:0 40px 18px 0}.ban-dialog p{color:#b6c1d2;line-height:1.55;overflow-wrap:anywhere}.ban-dialog-head{display:flex;justify-content:space-between;align-items:flex-start}.ban-close{border:0;background:transparent;color:#dbe5f5;font-size:1.5rem;cursor:pointer}.appeal-form{display:grid;gap:14px}.appeal-form label{display:grid;gap:7px;color:#e4eaf3}.appeal-form textarea{min-height:130px;resize:vertical}.appeal-note{font-size:.9rem;color:#aeb9ca}.appeal-message{padding:12px;border-radius:10px;background:#172237;color:#e5ebf5}.appeal-message.error{color:#ffb3b3}.appeal-message.success{color:#b6f2cc}
    @media(max-width:600px){.ban-page{padding-top:44px}.ban-card{grid-template-columns:1fr}.ban-duration,.ban-reason,.ban-meta,.ban-actions{grid-column:1}.ban-actions{flex-wrap:wrap}.ban-dialog{padding:18px}}
  </style>
    <script src="js/seguro.js?v=155"></script>
<link rel="stylesheet" href="css/odissey-brand.css?v=1">
</head>
<body>
  <main class="ban-page">
    <header class="ban-head"><h1>Baneos activos</h1><p>Consulta los detalles de una sanción o presenta una apelación para que el equipo la revise.</p></header>
    <div class="ban-controls"><input id="ban-search" type="search" placeholder="Buscar jugador, staff o motivo…" aria-label="Buscar baneos"></div>
    <p id="ban-status" class="ban-status" role="status">Cargando baneos…</p>
    <section id="ban-list" class="ban-list" aria-live="polite"></section>
  </main>

  <div id="ban-detail-modal" class="ban-modal" hidden><section class="ban-dialog" role="dialog" aria-modal="true" aria-labelledby="ban-detail-title"><div class="ban-dialog-head"><h2 id="ban-detail-title">Detalles del baneo</h2><button class="ban-close" type="button" data-close="ban-detail-modal" aria-label="Cerrar">×</button></div><div id="ban-detail-content"></div></section></div>
  <div id="appeal-modal" class="ban-modal" hidden><section class="ban-dialog" role="dialog" aria-modal="true" aria-labelledby="appeal-title"><div class="ban-dialog-head"><h2 id="appeal-title">Apelar baneo</h2><button class="ban-close" type="button" data-close="appeal-modal" aria-label="Cerrar">×</button></div><div id="appeal-content"></div></section></div>
  <div id="loginModal" class="ban-modal" hidden role="dialog" aria-modal="true" aria-label="Iniciar sesión"><section class="ban-dialog"><div class="ban-dialog-head"><h2>Inicia sesión para apelar</h2><button class="ban-close" type="button" onclick="closeLoginModal()" aria-label="Cerrar">×</button></div><div id="loginView"></div></section></div>

  <script src="site-config.js"></script>
  <script src="js/supabase.js?v=148"></script><script src="js/datos.js?v=148" defer></script>
  <script src="js/turnstile.js?v=148" defer></script><script src="auth.js?v=148"></script>
  <script src="js/baneos.js?v=148"></script>
</body>
</html>
